<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش‌کننده ویدیو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./admin/body.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #video-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            grid-gap: 10px;
            padding: 20px;
        }

        .video-item {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
        }
        .video-item:hover{
            transform: scale(1.05);
        }

        .video-item video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        #video-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        #video-player video {
            max-width: 90%;
            max-height: 90%;
        }

        #player-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        #player-controls i{
            font-size: 2rem;
            cursor: pointer;
            color: white;
            opacity: 0.7;
            transition: opacity 0.3s, transform 0.2s;
        }
        #player-controls i:hover{
            opacity: 1;
            transform: scale(1.2);
        }
        #close-player{
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
        }
        #upload-button{
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            z-index: 1002;
        }
        #video-upload{
            display: none;
        }
    </style>
</head>
<body>
<div id="looDiv"></div>
<section id="body">
    <i class="fas fa-ellipsis-v" id="upload-button"></i>
    <input type="file" id="video-upload" accept="video/*" multiple>
    <div id="video-list"></div>
    <div id="video-player">
        <span id="close-player">&times;</span>
        <video controls id="main-video"></video>
        <div id="player-controls">
            <i class="fas fa-backward" id="backward"></i>
            <i class="fas fa-play" id="play"></i>
            <i class="fas fa-forward" id="forward"></i>
        </div>
    </div>

    <script>
        const videoUpload = document.getElementById('video-upload');
        const videoList = document.getElementById('video-list');
        const videoPlayer = document.getElementById('video-player');
        const mainVideo = document.getElementById('main-video');
        const closePlayer = document.getElementById('close-player');
        const playButton = document.getElementById('play');
        const backwardButton = document.getElementById('backward');
        const forwardButton = document.getElementById('forward');
        const uploadButton = document.getElementById('upload-button');

        uploadButton.addEventListener('click', ()=>{
            videoUpload.click();
        })

         // بازیابی ویدیوها از localStorage
        const storedVideos = JSON.parse(localStorage.getItem('videoList')) || [];
        storedVideos.forEach(videoData => {
            addVideoToList(videoData);
        });

        videoUpload.addEventListener('change', (event) => {
            const files = event.target.files;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const videoData = e.target.result;
                    addVideoToList(videoData);
                     // ذخیره ویدیوها در localStorage
                    storedVideos.push(videoData);
                    localStorage.setItem('videoList', JSON.stringify(storedVideos));
                };
                reader.readAsDataURL(file);
            }
        });

         function addVideoToList(videoData){
            const video = document.createElement('video');
                    video.src = videoData;
                    const videoItem = document.createElement('div');
                    videoItem.classList.add('video-item');
                    videoItem.appendChild(video);
                    videoList.appendChild(videoItem);

                    videoItem.addEventListener('click', () => {
                        mainVideo.src = video.src;
                        videoPlayer.style.display = 'flex';
                        mainVideo.play();
                        playButton.classList.remove('fa-play');
                        playButton.classList.add('fa-pause');
                    });
        }
        closePlayer.addEventListener('click', () => {
            videoPlayer.style.display = 'none';
            mainVideo.pause();
        });
        playButton.addEventListener('click', () => {
            if (mainVideo.paused) {
                mainVideo.play();
                playButton.classList.remove('fa-play');
                playButton.classList.add('fa-pause');
            } else {
                mainVideo.pause();
                playButton.classList.remove('fa-pause');
                playButton.classList.add('fa-play');
            }
        });

        backwardButton.addEventListener('click', () => {
            mainVideo.currentTime -= 5; // پنج ثانیه به عقب
        });

        forwardButton.addEventListener('click', () => {
            mainVideo.currentTime += 5; // پنج ثانیه به جلو
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</section>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
