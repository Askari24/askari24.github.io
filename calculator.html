<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./admin/body.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <style>
        #body {
            background-color: #f5f5f5; /* پس‌زمینه روشن */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        #calculator {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
        }

        #display {
            background-color: #eee;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            text-align: right;
            font-size: 1.5rem;
            overflow: hidden; /* برای جلوگیری از بیرون رفتن متن از صفحه */
        }
        #expression{
            font-size: 1rem;
            color: gray;
        }

        .btn {
            width: 50px;
            height: 50px;
            margin: 5px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn:hover{
            filter: brightness(0.9);
        }
        .btn-green{
            background-color: #4CAF50;
            color: white;
        }
        .btn-gray{
            background-color: #e0e0e0;
            color: black;
        }

        .btn-operator {
            background-color: #eee;
        }
    </style>
</head>
<body>
<div id="looDiv"></div>
<section id="body">
    <div id="calculator">
        <div id="display">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>
        <div class="d-grid gap-2">
            <div class="row">
                <button class="btn btn-gray col">C</button>
                <button class="btn btn-gray col">()</button>
                <button class="btn btn-gray col">%</button>
                <button class="btn btn-operator col">÷</button>
            </div>
            <div class="row">
                <button class="btn col">7</button>
                <button class="btn col">8</button>
                <button class="btn col">9</button>
                <button class="btn btn-operator col">×</button>
            </div>
            <div class="row">
                <button class="btn col">4</button>
                <button class="btn col">5</button>
                <button class="btn col">6</button>
                <button class="btn btn-operator col">-</button>
            </div>
            <div class="row">
                <button class="btn col">1</button>
                <button class="btn col">2</button>
                <button class="btn col">3</button>
                <button class="btn btn-operator col">+</button>
            </div>
            <div class="row">
                <button class="btn col">+/-</button>
                <button class="btn col">0</button>
                <button class="btn col">.</button>
                <button class="btn btn-green col">=</button>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');
        const expressionDisplay = document.getElementById('expression');
        const buttons = document.querySelectorAll('.btn');

        let currentExpression = '';
        let result = 0;


        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const buttonText = button.textContent;

                switch (buttonText) {
                    case 'C':
                        display.textContent = '0';
                        expressionDisplay.textContent = '';
                        currentExpression = '';
                        result = 0;
                        break;
                    case '=':
                        try {
                            result = eval(currentExpression);
                            display.textContent = result;
                            expressionDisplay.textContent = currentExpression + "=";
                            currentExpression = result;
                        } catch (error) {
                            display.textContent = 'Error';
                        }
                        break;
                    case '+/-':
                        result = parseFloat(display.textContent) * -1;
                        display.textContent = result;
                        break;
                    case '()':
                        // پیاده‌سازی پرانتز پیچیده‌تر است و در این مثال ساده آورده نشده.
                        break;
                    default:
                        if(display.textContent === "0" && !isNaN(parseInt(buttonText))){
                            display.textContent = buttonText;
                            currentExpression += buttonText;
                        }else{
                            display.textContent += buttonText;
                            currentExpression += buttonText;
                        }
                        break;
                }
            });
        });
    </script>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
