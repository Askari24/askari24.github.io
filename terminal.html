<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترمینال وب</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212529;
            color: #ffffff;
            font-family: monospace;
        }
        #terminal {
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #39ff14;
            background-color: #1e1e1e;
        }
        .input-line {
            display: flex;
        }
        .prompt {
            margin-right: 5px;
        }
        .input-field {
            flex: 1;
            background-color: transparent;
            border: none;
            color: #ffffff;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">ترمینال وب</h1>
        <div id="terminal"></div>
        <div class="input-line">
            <span class="prompt">پیشفرض$</span>
            <input type="text" id="input" class="input-field" autocomplete="off" />
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('input');

        function appendToTerminal(text) {
            const p = document.createElement('p');
            p.textContent = text;
            terminal.appendChild(p);
            terminal.scrollTop = terminal.scrollHeight; // Scroll to bottom
        }

        input.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                const command = input.value;
                appendToTerminal(`پیشفرض$ ${command}`);
                input.value = ''; // Clear input

                // Here you can add logic to handle commands
                if (command === 'سلام') {
                    appendToTerminal('سلام! چطور هستید؟');
                } else {
                    appendToTerminal('دستوری یافت نشد.');
                }
            }
        });
    </script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
