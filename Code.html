<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Code Generator</title>
<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Letter Code Generator</h1>
    <form id="letterForm">
        <div class="form-group">
            <label for="letterInput">Enter a letter:</label>
            <input type="text" class="form-control" id="letterInput" placeholder="Enter letter">
        </div>
        <button type="submit" class="btn btn-primary">Generate Code</button>
    </form>
    <div id="result"></div>
</div>
<script>
document.getElementById('letterForm').addEventListener('submit', function(event) {
    event.preventDefault();
    let letter = document.getElementById('letterInput').value.toUpperCase();
    let code = letter.charCodeAt(0);
    document.getElementById('result').innerText =` The code for letter '${letter}' is: ${code}`;
});

</script>
</body>
</html>
<style>
.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

#result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

</style>
