<script>
const appDrawer = document.getElementById('app-drawer');

        // نمایش ساعت
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('time').textContent = timeString;
        }
        setInterval(updateTime, 1000); // به‌روزرسانی هر ثانیه
        updateTime(); // اجرای اولیه

        // نمایش درصد باتری (شبیه‌سازی شده)
        function updateBattery() {
            // در اینجا باید از API مربوط به باتری مرورگر استفاده کنید
            // این کد فقط یک شبیه‌سازی است
            const batteryLevel = Math.floor(Math.random() * 101); // عدد تصادفی بین ۰ تا ۱۰۰
            document.getElementById('battery').textContent = `باتری: ${batteryLevel}%`;

        setInterval(updateBattery, 5000)
        updateBattery();

</script>

<script>
function ww3() {
    document.getElementById('w2').style.display = 'none';
    document.getElementById('w3').style.display = 'block';    
}
function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let day = now.toLocaleDateString('fa-IR', { weekday: 'long' });
            let date = now.toLocaleDateString('fa-IR', { day: 'numeric', month: 'long', year: 'numeric' });

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            document.getElementById('date').textContent = `${day}، ${date}`;
        }

        updateClock();
        setInterval(updateClock, 1000); // به‌روزرسانی هر ثانیه

        // اضافه کردن انیمیشن به صورت تاخیری
        setTimeout(() => {
            document.getElementById('clock').classList.add('animate-up');
            document.getElementById('date').classList.add('animate-up');
        }, 500); // تاخیر نیم ثانیه
</script>

    <h1>Life companion</h1>

    <div id="pin-display">

        <div class="key">1</div>
        <div class="key">2</div>
        <div class="key">3</div>
        <div class="key">4</div>
        <div class="key">5</div>
        <div class="key">6</div>
        <div class="key">7</div>
        <div class="key">8</div>
        <div class="key">9</div>
        <div class="key">Clr</div>
        <div class="key">0</div>
        <div class="key">Del</div>
    </div>
<script>
 const pinDisplay = document.getElementById('pin-display');
        const keys = document.querySelectorAll('.key');
        const message = document.getElementById('message');
        let enteredPin = '';
        const correctPin = '0000'; // رمز عبور صحیح

        keys.forEach(key => {
            key.addEventListener('click', () => {
                const keyValue = key.textContent;

                if (keyValue === 'Del') {
                    enteredPin = enteredPin.slice(0, -1);
                } else if (keyValue === 'Clr') {
                    enteredPin = '';
                } else if (enteredPin.length < 4) {
                    enteredPin += keyValue;
                }

                updatePinDisplay();
                if (enteredPin.length === 4) {
                    if (enteredPin === correctPin) {
                        message.textContent = 'رمز عبور صحیح است!';
                        message.classList.remove('error');

                        setTimeout(()=>{
                            document.getElementById('w4').style.display = 'block';
                            document.getElementById('w3').style.display = 'none';
                            document.getElementById('footer').style.display = 'block';

                        },1000)
                    } else {
                        message.textContent = 'رمز عبور اشتباه است!';
                        message.classList.add('error');
                        enteredPin = '';
                        updatePinDisplay();
                    }
                }
            });
        });

        function updatePinDisplay() {
            const circles = pinDisplay.querySelectorAll('.pin-circle');
            circles.forEach((circle, index) => {
                if (index < enteredPin.length) {
                    circle.classList.add('filled');
                } else {
                    circle.classList.remove('filled');
                }
            });
        }
</script>

<script>
 const appGrid = document.getElementById('app-grid');
        const searchInput = document.getElementById('search');

        const apps = [
            { name: 'دوربین', icon: 'favicon.ico',onclick:'w3()' },
            
        ];

        function displayApps(appsToDisplay) {
            appGrid.innerHTML = '';
            appsToDisplay.forEach(app => {
                const appIcon = document.createElement('div');
                appIcon.classList.add('app-icon');
                const img = document.createElement('img');
                img.src = app.icon; // مسیر آیکون برنامه
                img.alt = app.name;
                img.onclick=app.onclick;
                appIcon.appendChild(img);

                const appName = document.createElement('div');
                appName.classList.add('app-name');
                appName.textContent = app.name;
                appIcon.appendChild(appName);
                appGrid.appendChild(appIcon);
            });
        }
        displayApps(apps);

        searchInput.addEventListener('input', (e)=>{
            const searchValue = e.target.value.toLowerCase();
            const filteredApps = apps.filter(app=> app.name.toLowerCase().includes(searchValue));
            displayApps(filteredApps);
        })                  
</script>
