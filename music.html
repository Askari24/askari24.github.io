<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسیقی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./admin/body.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>
<body>
<div id="looDiv"></div>
<section id="body"> 
    <style>
        #body {
            background-color: #111; /* پس‌زمینه تیره */
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            display: none;
        }

        #music-list {
            padding: 20px;
            flex: 1; /* لیست آهنگ‌ها فضا را پر کند */
            overflow-y: auto; /* اسکرول در صورت لزوم */
        }

        .music-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
            background-color: #222; /* پس‌زمینه آیتم‌ها */
            padding: 10px;
        }

        .music-item:hover {
            transform: scale(1.02);
            background-color: #333; /* تغییر رنگ پس‌زمینه در hover */
        }

        .music-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            margin-right: 10px;
            border-radius: 5px;
        }

        #music-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #222; /* پس‌زمینه پخش‌کننده */
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
            padding: 20px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            box-shadow: 0 -2px 5px rgba(255, 255, 255, 0.1);
        }

        #music-player.open {
            transform: translateY(0);
        }

        #player-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 20px;
        }

        #player-controls i {
            font-size: 1.5rem; /* اندازه آیکون‌ها */
            cursor: pointer;
            color: white;
            opacity: 0.7;
            transition: opacity 0.3s, transform 0.2s;
        }

        #player-controls i:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #music-info {
            text-align: center;
            margin-bottom: 20px;
        }

        #music-info img {
            width: 150px; /* اندازه تصویر در پخش‌کننده */
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.2);
        }

        #progress-container {
            width: 100%;
            height: 5px;
            background-color: #555;
            cursor: pointer;
            border-radius: 2px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            width: 0%;
            background-color: #aaa;
            border-radius: 2px;
        }

        #time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        #volume-control {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }


        #volume-control input[type="range"] {
        flex: 1;
        margin: 0 10px;
    }
</style>

<i class="fas fa-plus-circle" id="upload-button" style="position: fixed; top: 20px; left: 20px; font-size: 2rem; cursor: pointer; color: white; z-index: 1002;"></i>
<input type="file" id="music-upload" accept="audio/*" multiple style="display: none;">
<div id="music-list">
    </div>

<div id="music-player">
    <div id="music-info">
        <img src="placeholder.jpg" alt="" id="music-image">
        <h3 id="music-title">نام آهنگ</h3>
        <p id="music-artist">نام خواننده</p>
    </div>
    <div id="progress-container">
        <div id="progress"></div>
    </div>
    <div id="time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
    </div>
    <div id="player-controls">
        <i class="fas fa-random"></i>
        <i class="fas fa-backward" id="prev"></i>
        <i class="fas fa-play" id="play"></i>
        <i class="fas fa-forward" id="next"></i>
        <i class="fas fa-redo"></i>
    </div>
     <div id="volume-control">
        <i class="fas fa-volume-down"></i>
        <input type="range" min="0" max="100" value="50" id="volume-slider">
        <i class="fas fa-volume-up"></i>
    </div>
</div>

<script>
const musicList = document.getElementById('music-list');
const musicPlayer = document.getElementById('music-player');
const musicImage = document.getElementById('music-image');
const musicTitle = document.getElementById('music-title');
const musicArtist = document.getElementById('music-artist');
const playButton = document.getElementById('play');
const prevButton = document.getElementById('prev');
const nextButton = document.getElementById('next');
const progressBar = document.getElementById('progress');
const progressContainer = document.getElementById('progress-container');
const currentTimeDisplay = document.getElementById('current-time');
const durationDisplay = document.getElementById('duration');
const volumeSlider = document.getElementById('volume-slider');
const uploadButton = document.getElementById('upload-button');
const musicUpload = document.getElementById('music-upload');

let currentMusicIndex = 0;
let audio = new Audio();
let isPlaying = false;

let storedMusics = JSON.parse(localStorage.getItem('musicList')) || [];

function displayMusics(){
musicList.innerHTML = "";
storedMusics.forEach((music, index) => {
const musicItem = document.createElement('div');
musicItem.classList.add('music-item');
musicItem.innerHTML = `
    <img src="${music.image || 'placeholder.jpg'}" alt="${music.title}">
    <div>
        <h5>${music.title}</h5>
        <p>${music.artist}</p>
    </div>
`;
musicList.appendChild(musicItem);

musicItem.addEventListener('click', () => {
    currentMusicIndex = index;
    loadMusic(storedMusics[currentMusicIndex]);
    musicPlayer.classList.add('open');
});
});
}

displayMusics()

uploadButton.addEventListener('click', () => {
musicUpload.click();
});


musicUpload.addEventListener('change', (event) => {
const files = event.target.files;
for (const file of files) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const music = {
            title: file.name,
            artist: "نامشخص", // می‌توانید این را بعداً از فراداده فایل استخراج کنید
            src: e.target.result,
            image: null // می‌توانید تصویر پیش‌فرض یا تصویری از فراداده فایل قرار دهید
        };
        storedMusics.push(music);
        localStorage.setItem('musicList', JSON.stringify(storedMusics));
        displayMusics()
    };
    reader.readAsDataURL(file);
}
});
function loadMusic(music) {
audio.src = music.src;
musicImage.src = music.image || "placeholder.jpg";
musicTitle.textContent = music.title;
musicArtist.textContent = music.artist;
audio.load();
audio.addEventListener('loadedmetadata', () => {
    durationDisplay.textContent = formatTime(audio.duration);
});
if (isPlaying) {
    audio.play();
}
}

function formatTime(seconds) {
const minutes = Math.floor(seconds / 60);
const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, '0');
return `${minutes}:${remainingSeconds}`;
}

playButton.addEventListener('click', () => {
if (isPlaying) {
    audio.pause();
    playButton.classList.remove('fa-pause');
    playButton.classList.add('fa-play');
} else {
    audio.play();
    playButton.classList.remove('fa-play');
    playButton.classList.add('fa-pause');
}
isPlaying = !isPlaying;
});

nextButton.addEventListener('click', () => {
currentMusicIndex = (currentMusicIndex + 1) % storedMusics.length;
loadMusic(storedMusics[currentMusicIndex]);
});

prevButton.addEventListener('click', () => {
currentMusicIndex = (currentMusicIndex - 1 + storedMusics.length) % storedMusics.length;
loadMusic(storedMusics[currentMusicIndex]);
});

audio.addEventListener('timeupdate', () => {
const progressPercent = (audio.currentTime / audio.duration) * 100;
progressBar.style.width = `${progressPercent}%`;
currentTimeDisplay.textContent = formatTime(audio.currentTime);
});

progressContainer.addEventListener('click', (e) => {
const containerWidth = progressContainer.offsetWidth;
const clickX = e.offsetX;
const newCurrentTime = (clickX / containerWidth) * audio.duration;
audio.currentTime = newCurrentTime;
});

volumeSlider.addEventListener('input', () => {
audio.volume = volumeSlider.value / 100;
});

</script>
</section>

</body>
</html>
