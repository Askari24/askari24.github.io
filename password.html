<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمزساز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                رمزساز قدرتمند
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="passwordLength" class="form-label">طول رمز عبور:</label>
                    <input type="number" class="form-control" id="passwordLength" value="10" min="1" max="50">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="includeNumbers" checked>
                    <label class="form-check-label" for="includeNumbers">شامل اعداد (0-9)</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="includeLowercase" checked>
                    <label class="form-check-label" for="includeLowercase">شامل حروف کوچک (a-z)</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="includeUppercase" checked>
                    <label class="form-check-label" for="includeUppercase">شامل حروف بزرگ (A-Z)</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="includeSymbols">
                    <label class="form-check-label" for="includeSymbols">شامل علامت‌ها (!@#$%^&*)</label>
                </div>
                <div class="mb-3">
                    <button class="btn btn-primary w-100" id="generatePassword">ساخت رمز عبور</button>
                </div>
                <div class="mb-3">
                    <label for="passwordResult" class="form-label">رمز عبور تولید شده:</label>
                    <input type="text" class="form-control" id="passwordResult" readonly>
                </div>
            </div>
        </div>
    </div>

    <script>
        const passwordLength = document.getElementById('passwordLength');
const includeNumbers = document.getElementById('includeNumbers');
const includeLowercase = document.getElementById('includeLowercase');
const includeUppercase = document.getElementById('includeUppercase');
const includeSymbols = document.getElementById('includeSymbols');
const generatePasswordButton = document.getElementById('generatePassword');
const passwordResult = document.getElementById('passwordResult');

generatePasswordButton.addEventListener('click', () => {
    const length = passwordLength.value;
    const numbers = includeNumbers.checked;
    const lowercase = includeLowercase.checked;
    const uppercase = includeUppercase.checked;
    const symbols = includeSymbols.checked;

    const password = generatePassword(length, numbers, lowercase, uppercase, symbols);
    passwordResult.value = password;
});

function generatePassword(length, numbers, lowercase, uppercase, symbols) {
    let characters = '';
    if (numbers) characters += '0123456789';
    if (lowercase) characters += 'abcdefghijklmnopqrstuvwxyz';
    if (uppercase) characters += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (symbols) characters += '!@#$%^&*';

    let password = '';
    if (characters.length === 0) return 'لطفا حداقل یک گزینه را انتخاب کنید.';

    for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * characters.length);
        password += characters[randomIndex];
    }

    return password;
}
    </script>
</body>
</html>
<style>
    /* می‌توانید استایل‌های دلخواه خود را اینجا اضافه کنید */
body {
    font-family: sans-serif;
}
</style>
