<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./admin/body.css">

    <style>
        body {
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            grid-gap: 10px;
            padding: 20px;
        }

        .gallery-item {
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
            position: relative; /* برای قرار دادن دکمه حذف */
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        #image-viewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        #image-viewer img {
            max-width: 90%;
            max-height: 90%;
        }

        #close-viewer {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
        }
        #upload-button{
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: white;
            z-index: 1002;
        }
        #image-upload{
            display: none;
        }
    </style>
</head>
<body>
<div id="looDiv"></div>
<section id="body">
    <i class="fas fa-ellipsis-v" id="upload-button"></i>
    <input type="file" id="image-upload" accept="image/*" multiple>
    <div id="gallery-container"></div>
    <div id="image-viewer">
        <span id="close-viewer">&times;</span>
        <img src="" alt="" id="viewer-image">
    </div>

    <script>
        const imageUpload = document.getElementById('image-upload');
        const galleryContainer = document.getElementById('gallery-container');
        const imageViewer = document.getElementById('image-viewer');
        const viewerImage = document.getElementById('viewer-image');
        const closeViewer = document.getElementById('close-viewer');
        const uploadButton = document.getElementById('upload-button');

        uploadButton.addEventListener('click', ()=>{
            imageUpload.click();
        })

        // بازیابی تصاویر از localStorage
        const storedImages = JSON.parse(localStorage.getItem('galleryImages')) || [];
        storedImages.forEach(imgData => {
            addImageToGallery(imgData);
        });

        imageUpload.addEventListener('change', (event) => {
            const files = event.target.files;
            for (const file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgData = e.target.result;
                    addImageToGallery(imgData);


                    // ذخیره تصاویر در localStorage
                    storedImages.push(imgData);
                    localStorage.setItem('galleryImages', JSON.stringify(storedImages));
                }
                reader.readAsDataURL(file);
            }
        });

        function addImageToGallery(imgData){
            const img = document.createElement('img');
                    img.src = imgData;
                    const galleryItem = document.createElement('div');
                    galleryItem.classList.add('gallery-item');
                    galleryItem.appendChild(img);
                    galleryContainer.appendChild(galleryItem);

                    galleryItem.addEventListener('click', ()=>{
                        imageViewer.style.display = 'flex';
                        viewerImage.src = img.src;
                    })
        }

        closeViewer.addEventListener('click', () => {
            imageViewer.style.display = 'none';
        });
    </script>
</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
<script src="./admin/body.js"></script>
<script src="./tool/loo.js"></script>
